services:
  postgres:
    image: postgres:17
    container_name: cinema_db
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    ports:
      - "5432:5432"
    volumes:
      - cinema-data:/var/lib/postgresql/data

volumes:
  cinema-data: