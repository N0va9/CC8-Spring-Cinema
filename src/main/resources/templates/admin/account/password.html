<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mon mot de passe')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <nav th:replace="~{fragments/layout :: adminNav('account')}"></nav>
    <h1 class="font-display display-5 mb-4">Mon <span class="text-accent">mot de passe</span></h1>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <form class="card-retro p-4 form-retro" th:object="${form}" th:action="@{/admin/account/password}"
          method="post" novalidate>
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-retro-error" role="alert">
            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erreur</p>
        </div>

        <div class="mb-3">
            <label for="currentPassword" class="form-label fw-bold">Mot de passe actuel</label>
            <input id="currentPassword" name="currentPassword" type="password" class="form-control retro-input"
                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                   autocomplete="current-password">
            <div class="invalid-feedback" th:errors="*{currentPassword}">Erreur</div>
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label fw-bold">Nouveau mot de passe</label>
            <input id="newPassword" name="newPassword" type="password" class="form-control retro-input"
                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                   autocomplete="new-password">
            <div class="invalid-feedback" th:errors="*{newPassword}">Erreur</div>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label fw-bold">Confirmation</label>
            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control retro-input"
                   autocomplete="new-password">
            <p class="text-danger fw-bold mt-2 mb-0" th:if="${#fields.hasErrors('confirmationValide')}"
               th:errors="*{confirmationValide}">Erreur</p>
        </div>

        <button type="submit" class="btn btn-retro px-4 mt-2">CHANGER</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
