<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Utilisateurs')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <nav th:replace="~{fragments/layout :: adminNav('users')}"></nav>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <h1 class="font-display display-5 mb-0">Admin · <span class="text-accent">Utilisateurs</span></h1>
        <a class="btn btn-retro px-4 d-inline-flex align-items-center" th:href="@{/admin/users/new}">+ NOUVEL ADMIN</a>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <form class="row g-3 search-form mb-4" th:action="@{/admin/users}" method="get" role="search">
        <div class="col-12 col-md">
            <label for="keyword" class="visually-hidden">Rechercher un utilisateur</label>
            <input id="keyword" class="form-control retro-input" type="search" name="keyword"
                   th:value="${keyword}" placeholder="Identifiant, e-mail ou nom">
        </div>
        <div class="col-12 col-md-auto d-grid">
            <button class="btn btn-ink px-4" type="submit">Rechercher</button>
        </div>
    </form>

    <p th:if="${page.empty}" class="fw-bold">Aucun utilisateur.</p>

    <div class="table-responsive card-retro" th:unless="${page.empty}">
        <table class="table table-retro align-middle mb-0">
            <thead>
            <tr>
                <th scope="col">Identifiant</th>
                <th scope="col">Nom</th>
                <th scope="col">E-mail</th>
                <th scope="col">Rôle</th>
                <th scope="col" class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${page.content}">
                <td class="fw-bold" th:text="${u.username}">admin</td>
                <td th:text="|${u.firstName} ${u.lastName}|">Prénom Nom</td>
                <td th:text="${u.email} ?: '—'">mail</td>
                <td th:text="${u.role}">ADMIN</td>
                <td class="text-end">
                    <div class="d-inline-flex gap-2">
                        <a class="btn btn-ink btn-sm" th:href="@{/admin/users/{id}/edit(id=${u.id})}">Modifier</a>
                        <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                              onsubmit="return confirm('Supprimer ce compte ?');">
                            <button class="btn btn-outline-danger btn-sm rounded-0" type="submit">Supprimer</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:replace="~{fragments/layout :: pagination(${page}, '/admin/users', ${keyword})}"></nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
