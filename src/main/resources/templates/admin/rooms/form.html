<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Salle')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <a th:href="@{/admin/rooms}" class="fw-bold">&larr; Retour à la liste</a>
    <h1 class="font-display display-5 mt-3 mb-4"
        th:text="${form.id == null} ? 'Nouvelle salle' : 'Modifier la salle'">Salle</h1>

    <form class="card-retro p-4 form-retro" th:object="${form}" method="post" novalidate
          th:action="${form.id == null} ? @{/admin/rooms} : @{/admin/rooms/{id}(id=${form.id})}">
        <input type="hidden" th:field="*{id}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-retro-error" role="alert">
            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erreur</p>
        </div>

        <div class="mb-3">
            <label for="cinemaId" class="form-label fw-bold">Cinéma</label>
            <select id="cinemaId" class="form-select retro-input" th:field="*{cinemaId}" th:errorclass="is-invalid">
                <option value="">Choisir un cinéma</option>
                <option th:each="c : ${cinemas}" th:value="${c.id}" th:text="|${c.nom} (${c.ville})|">Cinéma</option>
            </select>
            <div class="invalid-feedback" th:errors="*{cinemaId}">Erreur</div>
        </div>

        <div class="row g-3">
            <div class="col-12 col-md-4">
                <label for="numero" class="form-label fw-bold">Numéro</label>
                <input id="numero" type="number" min="1" class="form-control retro-input" th:field="*{numero}"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{numero}">Erreur</div>
            </div>
            <div class="col-12 col-md-4">
                <label for="capacite" class="form-label fw-bold">Capacité</label>
                <input id="capacite" type="number" min="1" class="form-control retro-input" th:field="*{capacite}"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{capacite}">Erreur</div>
            </div>
            <div class="col-12 col-md-4">
                <label for="dateConstr" class="form-label fw-bold">Construction</label>
                <input id="dateConstr" type="date" class="form-control retro-input" th:field="*{dateConstr}"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{dateConstr}">Erreur</div>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-3 mt-4">
            <button type="submit" class="btn btn-retro px-4">ENREGISTRER</button>
            <a class="btn btn-ink d-inline-flex align-items-center" th:href="@{/admin/rooms}">Annuler</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
