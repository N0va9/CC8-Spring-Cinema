<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Cinémas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <h1 class="font-display display-5 mb-0">Admin · <span class="text-accent">Cinémas</span></h1>
        <a class="btn btn-retro px-4 d-inline-flex align-items-center" th:href="@{/admin/cinemas/new}">+ NOUVEAU CINÉMA</a>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <form class="row g-3 search-form mb-4" th:action="@{/admin/cinemas}" method="get" role="search">
        <div class="col-12 col-md">
            <label for="keyword" class="visually-hidden">Rechercher un cinéma</label>
            <input id="keyword" class="form-control retro-input" type="search" name="keyword"
                   th:value="${keyword}" placeholder="Nom ou ville">
        </div>
        <div class="col-12 col-md-auto d-grid">
            <button class="btn btn-ink px-4" type="submit">Rechercher</button>
        </div>
    </form>

    <p th:if="${cinemas.empty}" class="fw-bold">Aucun cinéma.</p>

    <div class="table-responsive card-retro" th:unless="${cinemas.empty}">
        <table class="table table-retro align-middle mb-0">
            <thead>
            <tr>
                <th scope="col">Nom</th>
                <th scope="col">Adresse</th>
                <th scope="col">Ville</th>
                <th scope="col" class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${cinemas.content}">
                <td class="fw-bold" th:text="${c.nom}">Nom</td>
                <td th:text="|${c.numero} ${c.rue}|">Adresse</td>
                <td th:text="${c.ville}">Ville</td>
                <td class="text-end">
                    <div class="d-inline-flex gap-2">
                        <a class="btn btn-ink btn-sm" th:href="@{/admin/cinemas/{id}/edit(id=${c.id})}">Modifier</a>
                        <form th:action="@{/admin/cinemas/{id}/delete(id=${c.id})}" method="post"
                              onsubmit="return confirm('Supprimer ce cinéma ?');">
                            <button class="btn btn-outline-danger btn-sm rounded-0" type="submit">Supprimer</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${cinemas.totalPages > 1}" class="mt-4" aria-label="Pagination">
        <ul class="pagination justify-content-center flex-wrap gap-1">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, cinemas.totalPages - 1)}"
                th:classappend="${i == cinemas.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/cinemas(keyword=${keyword}, page=${i})}" th:text="${i + 1}">1</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
