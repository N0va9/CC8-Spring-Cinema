<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - CC8 Cinéma'">CC8 Cinéma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/cinema.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-md bg-ink retro-nav" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">CC8 <span class="text-accent">CINÉMA</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Ouvrir le menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto gap-md-3">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">CINÉMAS</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/films}">FILMS</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/cinemas}">ADMIN</a></li>
            </ul>
        </div>
    </div>
</nav>

<nav th:fragment="pagination(page, url, keyword)" th:if="${page.totalPages > 1}" class="mt-4" aria-label="Pagination">
    <ul class="pagination justify-content-center flex-wrap gap-1">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" aria-label="Page précédente"
               th:href="@{${url}(keyword=${keyword}, page=${page.number - 1})}"
               th:tabindex="${page.first} ? '-1'" th:aria-disabled="${page.first} ? 'true'">&lsaquo;</a>
        </li>

        <li class="page-item" th:each="item : ${@pagination.items(page)}"
            th:classappend="${item.ellipsis} ? 'disabled' : (${item.number == page.number} ? 'active')">
            <span class="page-link" th:if="${item.ellipsis}">&hellip;</span>
            <a class="page-link" th:unless="${item.ellipsis}"
               th:href="@{${url}(keyword=${keyword}, page=${item.number})}"
               th:aria-current="${item.number == page.number} ? 'page'"
               th:text="${item.number + 1}">1</a>
        </li>

        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" aria-label="Page suivante"
               th:href="@{${url}(keyword=${keyword}, page=${page.number + 1})}"
               th:tabindex="${page.last} ? '-1'" th:aria-disabled="${page.last} ? 'true'">&rsaquo;</a>
        </li>
    </ul>
</nav>

<nav th:fragment="adminNav(active)" class="d-flex flex-wrap gap-2 mb-4" aria-label="Sections d'administration">
    <a class="btn" th:classappend="${active == 'cinemas'} ? 'btn-ink' : 'btn-outline-ink'"
       th:href="@{/admin/cinemas}">Cinémas</a>
    <a class="btn" th:classappend="${active == 'rooms'} ? 'btn-ink' : 'btn-outline-ink'"
       th:href="@{/admin/rooms}">Salles</a>
    <a class="btn" th:classappend="${active == 'movies'} ? 'btn-ink' : 'btn-outline-ink'"
       th:href="@{/admin/movies}">Films</a>
    <a class="btn" th:classappend="${active == 'sessions'} ? 'btn-ink' : 'btn-outline-ink'"
       th:href="@{/admin/sessions}">Séances</a>
</nav>

<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-retro-success" role="status" th:text="${success}">Succès</div>
    <div th:if="${error}" class="alert alert-retro-error" role="alert" th:text="${error}">Erreur</div>
</div>

<footer th:fragment="footer" class="bg-ink mt-5">
    <div class="container py-4 small text-paper">CC8 Spring Cinema</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
